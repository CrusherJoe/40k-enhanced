# Archetype play-notes for the LSO 2026 field — verdict + how-to-play are FROM YOUR SEAT
# (Imperial Knights, "This List Tastes Like Death by Rock and Roll" / death_rnr).
# Seeded from the verified meta-map in MEMORY.md; verdicts vs Knights transfer directly.
# Edit freely; `tools/bcp_archetypes.py build` folds these into the player lookup.
# Key = exactly the archetype key ("<Faction> — <primary detachment>"). Verdict scale:
# FAVOURABLE / COIN-FLIP / UNFAVOURABLE / HARD (accept-the-loss).

"Adeptus Custodes — Shield Host":
  verdict: "FAVOURABLE — out-OC + grind"
  play: "Elite-but-FEW (W3-4, ~40 models). Out-OC (your OC10 vs their OC2) and grind their bodies with anti-infantry VOLUME (Avenger/RFBC/plasma). Volcano/thermal the Caladius + characters, NOT W3 Custodians (overkill). Lancer SWEEP (A10 S10) chews squads; target-rich for decapitation. Don't get greedy into their melee."

"Adeptus Custodes — Lions of the Emperor":
  verdict: "FAVOURABLE — out-OC + grind (HeeYaw 66-58 win)"
  play: "Same as Shield Host: so-few-models, out-OC and grind them off with volume. Watch Martial Ka'tah stances in melee — stay at range, refuse the gang. Lancer sweeps their squads; Volcano the Caladius/characters, not W3 bodies."

"Imperial Knights — Valourstrike Lance":
  verdict: "MIRROR — the ditto"
  play: "Knightball mirror (your own build). First turn + Rotate discipline decides it. Trade Volcano/plasma into their Questoris, Lancer hunts their Lancer/Castellan (Epic Challenge to snipe an attached char), win the secondary game. Don't lose a gun-Knight to their Lancer un-Rotated."

"Space Marines (Astartes) — Librarius Conclave":
  verdict: "COIN-FLIP → hard (kill the engine)"
  play: "The Great Value engine: Dev-Wound Sternguard + Librarian Conclave discipline + Oath re-rolls stack a volley that IGNORES your invuln. KILL THE MULTIPLIER first (Librarian / re-roll or mark engine / Storm Speeder) — the naked bricks are chaff without it. Screen the alpha; don't cluster near a reactive shooter."

"Dark Angels — Librarius Conclave":
  verdict: "COIN-FLIP → hard (kill the engine)"
  play: "As the SM Conclave — Dev-Wound plasma/Sternguard + psychic buffs that bypass invuln. Kill the buff/psychic engine first; spread vs Dev-wound smite; deny the alpha."

"Necrons — Cursed Legion":
  verdict: "UNFAVOURABLE (~20-30%)"
  play: "54 Cold-Fervour Gauss (S7 AP-2 Lethal) + reanimation + out-OC, often an un-killable Void Dragon. Firepower-as-DENIAL: delete their soft OC to starve scoring, don't chase the un-killable. Accept the board loss, bank mobility secondaries, win on tempo not attrition."

"Necrons — Awakened Dynasty":
  verdict: "HARD / play-the-mission (triple-C'tan wall)"
  play: "Un-killable: C'tan T11 W16 4++, -1 to incoming Damage, necrodermis return. You CANNOT table them. Remove the no-invuln support (Crypteks/lords) at range, out-tempo on secondaries, play the mission — never dump firepower into a C'tan."

"Tyranids — Assimilation Swarm":
  verdict: "COIN-FLIP — kill-race"
  play: "5-Norn monster-mash w/ heal/regen + OC15 anchors. It's a KILL-RACE not an OC war (OC15 is unshiftable). Focus-kill the NO-INVULN pieces at range (Emissaries, Zoanthropes, Neurotyrant), grind the 4++ Assimilators, REFUSE the melee gang (kite M10-14), Lancer-assassinate a Norn (~21/charge). Win on kills + removing anchors."

"Tyranids — Vanguard Onslaught":
  verdict: "COIN-FLIP → directional (fast infiltrators)"
  play: "Recon-disposition speed/infiltrate build — they out-tempo and grab early. Screen your deployment (deny infiltrate/scout charges >9\"), kill what scores, don't over-extend a gun-Knight. Directional read — verify at the table."

"T'au Empire — Retaliation Cadre":
  verdict: "UNFAVOURABLE"
  play: "Railgun Dev-Wounds + markerlight AP-volume + fusion; they fall-back-and-shoot and evasion neuters your melee. Kill the rail/fusion platforms EARLY (no invuln — your Volcano deletes them), deny the alpha strike, win the movement/mission game, don't rely on the charge."

"T'au Empire — Experimental Prototype Cadre":
  verdict: "UNFAVOURABLE"
  play: "As Retaliation — railgun Dev-Wounds + markerlight stacking. Prototype wargear = extra range/AP; kill the marker/rail platforms first, minimise firing angles into your Questoris, out-position."

"T'au Empire — Mont'ka":
  verdict: "UNFAVOURABLE → directional (aggressive T'au)"
  play: "Mont'ka = forward/alpha T'au (extra move+shoot on the key turn). Weather the aggressive turn from cover, then punish the exposed suits with your guns. Kill fusion/rail first. Directional — verify."

"Dark Angels — Company of Hunters":
  verdict: "UNFAVOURABLE (Ravenwing)"
  play: "Catechism Dev-Wound plasma + Black Knight Anti-Vehicle melee + 90-bike out-OC on Disruption + they fall-back-and-shoot. KILL THE STORM SPEEDER THUNDERSTRIKE FIRST (its mark = +1 to wound your Knights). Deny drops, accept the OC loss, don't feed the Black Knights a clean charge."

"Dark Angels — Wrath of the Rock":
  verdict: "HARD — accept it (Deathwing wall)"
  play: "Deathwing terminator bricks: 2+/4++, -1 Dmg, army-wide OC, NO decapitation target. This is the 31-98 hard-counter shape — you cannot out-body OR kill-race it (guns wrong-shaped, Lancer finds nothing to bite). Minimise the bleed, steal secondaries + tempo, accept the primary loss. Dodge if the draw allows."

"Leagues of Votann — Needgaârd Oathband":
  verdict: "COIN-FLIP — deny the drop"
  play: "Deep-strike Berserk maul-swarm (Anti-Vehicle 3+ MELEE wounds you regardless of S) + ~2 Land Fortresses. DENY THE DROPS (screen every landing >9\", Navigator Gaze bubble), kill the 2 Land Fortresses (no invuln), shred their W1 bodies. If the maul can't reach, you out-durable and out-shoot."

"Emperor's Children — Coterie of the Conceited":
  verdict: "COIN-FLIP — concede Fulgrim"
  play: "Fulgrim + fast Slaaneshi melee (re-roll charges, hits above weight). SCREEN/CONCEDE Fulgrim — don't feed the Lancer to him unless it's a clean one-round kill. Shoot the killable support, win Priority Assets on OC10, Lancer 4++ counter-charges the chaff melee. Don't get caught mid-board."

"Emperor's Children — Peerless Bladesmen":
  verdict: "COIN-FLIP — concede Fulgrim"
  play: "Slaaneshi elite-melee (Lucius/Lord Exultant + Flawless Blades/Infractors). Same plan: shoot the killable multipliers, refuse the melee trade you don't want, Lancer counters, win on OC/secondaries. Fast — screen your backfield."

"Emperor's Children — Carnival of Excess":
  verdict: "COIN-FLIP → directional"
  play: "Slaaneshi horde-lean (more bodies, Take-and-Hold). Anti-infantry volume into the blades, out-durable, hold objectives on OC10. Directional — verify the exact build."

"Drukhari — Skysplinter Assault":
  verdict: "FAVOURABLE"
  play: "Their Lethal/Decapitating keywords are NON-Vehicle → they don't touch your Knights, and no haywire. Out-durable and win the attrition. Only risk = losing Reconnaissance TEMPO — don't let them free-score; contest the board, kill the raiders (W-fragile)."

"Blood Angels — Liberator Assault Group":
  verdict: "HARD (melee)"
  play: "BA hammers/fists smash your no-invuln fight phase (the sim's worst matchup the other way). SHOOT THEM OFF BEFORE THE CHARGE, Lancer 4++ is your only melee answer, screen + kite the Death Company / Sanguinary hammer. Never let a gun-Knight get charged; win at range or not at all."

"Death Guard — Virulent Vectorium":
  verdict: "COIN-FLIP — grindy, don't feed the FNP"
  play: "Mortarion + Plague Marines, 5+++ and -1 Dmg army-wide. Don't grind into the FNP wall — out-tempo, remove what you can at range, play the mission. Mortarion is a Lancer target (T12 monster) but tanky; only commit for a clean kill."

"Thousand Sons — Grand Coven":
  verdict: "COIN-FLIP — kill the casters"
  play: "Rubric marines (2+, All Is Dust -1 Dmg) + Magnus + psychic Dev-Wounds that BYPASS invuln. Magnus = a Lancer decapitation target (big monster, but warded — commit only for the kill). Kill the psychic buff/caster engine, spread vs Dev-wound smite, grind the Rubrics with high-Dmg guns (their -1 Dmg blunts multi-dmg)."

"Thousand Sons — Rubricae Phalanx":
  verdict: "COIN-FLIP — kill the casters"
  play: "Rubric-heavy (2+/-1 Dmg bodies) + sorcerers. Same as Grand Coven: kill the casters/buff engine, use high-Dmg guns into the -1-Dmg Rubrics, spread vs Dev-wound smite. Out-OC where you can — Rubrics are low model-count."

"Orks — Equatorial Hordes":
  verdict: "HARD (horde) — accept the OC loss"
  play: "The horde pole — 100+ bodies you can't out-OC. Anti-infantry VOLUME into the blobs (Avenger/RFBC), kill what's ON the objectives, don't chase. Accept the OC loss, win secondaries where possible. Green-Tide-adjacent = known bad matchup."

"Orks — War Horde":
  verdict: "HARD (horde) — accept the OC loss"
  play: "Boyz-forward horde. Same as Equatorial: out-bodied, can't out-OC. Volume into the blobs, hold what you can, bank secondaries, accept the primary deficit."

"Orks — Dread Mob":
  verdict: "COIN-FLIP (dakka/walkers)"
  play: "Walker/dakka (Kill Rig, Deffkoptas, big meks, rokkits). Their rokkits pop your Armigers — keep them back. Trade guns, kill the anti-tank platforms, out-durable the shooting; fewer bodies than a horde so OC is winnable."

"World Eaters — Khorne Daemonkin":
  verdict: "HARD (melee blender)"
  play: "Angron + Berzerkers + Eightbound melee blender. SHOOT ON THE WAY IN, Lancer 4++ counter, screen + kite — never get charged in bulk. Angron is a Lancer target but returns; don't over-invest, just deny the charge and out-shoot."

"World Eaters — Berzerker Warband":
  verdict: "HARD (melee blender)"
  play: "Berzerker-heavy charge army. Same plan: kill on the approach, screen the charge lanes, Lancer counters the lead brick, kite the rest. Win at range or lose the fight phase."

"World Eaters — Possessed Slaughterband":
  verdict: "HARD → directional (melee)"
  play: "Possessed/daemon-engine melee. Shoot before the charge, Lancer 4++, screen. Directional — verify the engines (Lord of Skulls / daemon engines are Volcano targets)."

"Chaos Knights — Lords of Dread":
  verdict: "COIN-FLIP (knight duel)"
  play: "Big-model mirror-ish — War Dogs + Abhorrent/Tyrant. It's a Knight duel: Lancer hunts their big knights/war dogs, Rotate discipline vs their guns, first turn matters. Trade Volcano into their Questoris; watch dread abilities (fear/MW)."

"Chaos Knights — Infernal Lance":
  verdict: "COIN-FLIP (knight duel)"
  play: "War-Dog swarm lean. More small knights = out-activation risk; Lancer + Volcano pick off war dogs, Rotate the focused Knight, hold OC10 objectives. Knight duel — first turn + target priority decide it."

"Adeptus Mechanicus — Explorator Maniple":
  verdict: "UNFAVOURABLE (Rad-Zone-adjacent)"
  play: "Kataphron Anti-Vehicle-4+ + Lethal bricks ≈ a dead Knight/turn, and they out-body you. Kill the Kataphron bricks first (they're the anti-tank), deny the alpha, don't get out-scored — bank secondaries, respect the loss."

"Grey Knights — Banishers":
  verdict: "COIN-FLIP → directional (elite psychic TP)"
  play: "Elite terminators (2+/4++/5W) + teleport + psychic Dev-Wounds (ignore invuln) + deep strike. Deny the drops (>9\", Gaze bubble), out-OC the few bodies, spread vs psychic smite, focus casters. Directional — VERIFY at the table (new archetype, not yet play-tested vs Knights)."

# ---- second pass: the rest of the n>=2 clusters (grounded in real unit signatures) ----

"Chaos Daemons — Legion of Excess":
  verdict: "COIN-FLIP (fast Slaanesh melee)"
  play: "Keeper of Secrets + Fiends + Daemonettes — fast, fights-first melee. Screen the charge lanes, shoot the Keepers (big monster, but 4++ — commit guns not a wasted Lancer), out-durable the fragile Daemonettes. Don't get caught mid-board; Lancer counters a lead daemon."

"Imperial Knights — Freeblade Company":
  verdict: "COIN-FLIP (knight duel, Armiger-heavy)"
  play: "Mirror with more Armigers. Volume-kill their Armigers, Lancer hunts their big knights (Castellan/Destrier/Paladin), Rotate the focused Knight, first turn decides it. Out-activate carefully — more small knights = more of their activations."

"Chaos Space Marines — Cabal of Chaos":
  verdict: "COIN-FLIP (elite CSM + Abaddon)"
  play: "Abaddon/Huron + Chosen/Terminators + Defiler. WATCH DARK PACTS — they buy Lethal/Dev on demand (invuln-negation). Defiler = Volcano target; Chosen/Terminators die to AP volume; Abaddon/Huron are tough (Lancer only for a clean kill). Kill the buff characters, screen the alpha."

"Chaos Space Marines — Chaos Cult":
  verdict: "COIN-FLIP → horde-lean"
  play: "Cultist bodies + Defilers + bikers. Anti-infantry VOLUME into the cultists, Volcano the Defilers, out-durable; don't get out-OC'd by the chaff — kill what's on the points. Watch Dark Pacts on the Legionaries/Chosen."

"Death Guard — Champions of Contagion":
  verdict: "COIN-FLIP — grindy, don't feed the FNP"
  play: "Poxwalkers + Blight-haulers + Deathshroud + Lord of Contagion, 5+++ / -1 Dmg. Don't grind into the FNP; kill the Myphitic Blight-haulers (their anti-tank) at range, out-tempo, play the mission. Deathshroud are a nasty counter-charge — don't feed a gun-Knight."

"Space Marines (Astartes) — Shadowmark Talon":
  verdict: "COIN-FLIP → directional (RG stealth/jump alpha)"
  play: "Raven Guard infiltrate/stealth + jump-pack alpha (Shrike, Aethon Shaan, Incursors/Infiltrators). SCREEN your deployment to deny infiltrate/scout charges >9\", weather the jump alpha, out-shoot. Watch a marked-target buff. Directional — verify at the table."

"Leagues of Votann — Brandfast Oathband":
  verdict: "COIN-FLIP (durable mech gunline)"
  play: "Land Fortress + Sagitaur + Hearthkyn + Thunderkyn. Judgement tokens = re-roll wound + AP vs a marked unit (invuln-negation risk). Kill the Land Fortress + Thunderkyn (anti-tank), deny the judgement stack on a key Knight, out-durable; fewer bodies than Needgaård so OC is winnable."

"Genestealer Cult — Biosanctic Broodsurge":
  verdict: "COIN-FLIP (ambush + Purestrain melee)"
  play: "Purestrains + Abominant + Ridgerunners + Neophyte/Acolyte horde, cult ambush. DENY the ambush (screen every drop >9\"), anti-infantry volume into the bodies, Lancer counters the Purestrains. Watch the return/re-deploy; kill what scores, don't chase."

"Space Wolves — Saga of the Beastslayer":
  verdict: "HARD (terminator/character melee + Land Raider)"
  play: "Wolf Guard Terminators + Arjac/Bjorn/Logan delivered by a Land Raider Redeemer. SHOOT THE LAND RAIDER before it disgorges (Volcano), Lancer counters the lead brick, screen + kite. Their characters hit like trucks in melee — never get a gun-Knight charged."

"Necrons — Pantheon of Woe":
  verdict: "HARD / play-the-mission (double-C'tan)"
  play: "Nightbringer + Void Dragon C'tan (un-killable: 4++, -1 Dmg, necrodermis return) + Tomb Blades/Scarabs. Can't table the C'tan — kill the no-invuln soft OC (Tomb Blades/Scarabs), out-tempo on secondaries, play the mission. Never dump guns into a C'tan."

"Orks — More Dakka!":
  verdict: "COIN-FLIP (Ork shooting)"
  play: "Tankbustas + Flash Gitz + Shokk Attack + Boyz. Their rokkits/Tankbustas threaten your Armigers + Questoris — KILL THE TANKBUSTAS/FLASH GITZ first (their anti-tank), out-durable the dakka. Fewer bodies than a horde so OC is winnable; keep Armigers out of rokkit range."

"Astra Militarum — Grizzled Company":
  verdict: "UNFAVOURABLE (gunline + anti-tank volume)"
  play: "Orders + Bullgryn wall + tanks/artillery/lascannon volume that chunks Questoris. Kill the tanks/artillery/Hellhound early, weather the volume from cover, grind the infantry — but they out-body you on OC. Bank secondaries; don't over-expose a Knight to massed lascannon."

"Space Marines (Astartes) — Reclamation Force":
  verdict: "COIN-FLIP — kill the Eradicators"
  play: "Ballistus Dread + Bladeguard + ERADICATORS (melta — they delete a Knight) + Captain Titus. Eradicators are the #1 priority kill (no invuln, your Volcano/volume removes them), then the Ballistus. Out-durable the rest, trade guns; don't cluster a Knight in melta range."

"Emperor's Children — Court of the Phoenician":
  verdict: "COIN-FLIP — concede Fulgrim"
  play: "Fulgrim + Infractors/Flawless Blades/Noise Marines. Screen/concede Fulgrim, shoot the killable support, win Priority Assets on OC10, Lancer 4++ counters the chaff melee. Fast — protect your backfield."

"Aeldari — Aspect Host":
  verdict: "UNFAVOURABLE → directional (fast evasive aspects)"
  play: "Fire Dragons (MELTA — delete a Knight) + Warp Spiders + Banshees + Avatar + Falcon. KILL THE FIRE DRAGONS before they reach melta range (screen the Falcon delivery), evasion neuters your melee, they out-tempo. Avatar = a Lancer target. Expect a tempo loss; win where the guns can catch them."

"Astra Militarum — Bridgehead Strike":
  verdict: "COIN-FLIP → directional (deep-strike alpha)"
  play: "Tempestus Scions/Aquilons + Krieg deep-strike with melta/plasma. DENY THE DROPS (screen >9\", Gaze bubble), weather the alpha, then shred the droppers — they're T3 W1, volume deletes them once landed. Punish as they expose."

"Space Wolves — Saga of the Great Wolf":
  verdict: "HARD (terminator/leader melee)"
  play: "Wolf Guard Terminators + Aggressors + Arjac/Bjorn/Logan. As Beastslayer — shoot the delivery/lead brick before the charge, Lancer counter, screen + kite. Logan/Arjac wreck a gun-Knight in melee; win at range."

"Imperial Knights — Gate Warden Lance":
  verdict: "COIN-FLIP (defensive knight duel)"
  play: "Armigers + Canis Rex + big knights, defensive lance. Knight duel — Lancer hunts their big knights, volume-kills Armigers, Rotate the focused Knight. Canis Rex is a tough character-knight (Sir Hekhtur pilot ejects) — don't over-commit the Lancer into it."

"Chaos Daemons — Scintillating Legion":
  verdict: "COIN-FLIP (Tzeentch psychic Dev-wounds)"
  play: "Lord of Change + Be'lakor + Horrors + Screamers. Dev-wound smite BYPASSES your invuln — KILL THE CASTERS (Lord of Change/Be'lakor are warded 4++, commit guns for a clean kill), spread vs smite, anti-infantry into the Horrors. Watch Be'lakor's shadow debuffs."

"Space Marines (Astartes) — Forgefather's Seekers":
  verdict: "COIN-FLIP — kill the Eradicators/Speeder"
  play: "Salamander flamer/melta durable + ERADICATORS + Storm Speeder Hammerstrike + Vulkan. Kill the Eradicators (melta anti-tank) + Storm Speeder (anti-tank/buff) first, out-durable the flamers, trade guns. Vulkan buffs their melta — priority to remove the melta package."

"Tyranids — Crusher Stampede":
  verdict: "COIN-FLIP — kill-race (monster-mash)"
  play: "Norn Emissary/Assimilator + Tyrannofex + Hive Tyrant + Broodlord. Kill-race, not OC. Volcano the NO-INVULN Norn Emissary + Tyrannofex at range, Lancer-assassinate a Norn (~21/charge), refuse the melee gang (kite), grind the 4++ Assimilators. Win on kills + anchors removed."

"Adepta Sororitas — Bringers of Flame":
  verdict: "COIN-FLIP — kill the melta package"
  play: "Vahl + Paragons (melta HAMMER) + Immolators + Castigator + Dominions. Their buffed melta is REAL anti-tank that chunks Knights — KILL VAHL+PARAGONS and the melta Dominions first (Paragons T7 2+/4++; the girls are T3 W1, volume shreds them). Watch Miracle Dice on a key save/wound. Out-durable once the melta's gone."

"Genestealer Cult — Outlander Claw":
  verdict: "COIN-FLIP → directional (fast vehicle ambush)"
  play: "Ridgerunners + Jackals + Rockgrinder + Purestrains, fast ambush. Deny the ambush (>9\"), kill the Rockgrinder/Ridgerunners (their punch), anti-infantry into the horde, Lancer counters Purestrains. They out-tempo — contest, don't chase. Directional."

"Necrons — Hypercrypt Legion":
  verdict: "HARD → directional (teleport + C'tan)"
  play: "Transcendent C'tan + Reanimator + Wraiths + hypercrypt teleport (redeploy anywhere). Deny the drops, can't kill the C'tan — play the mission, remove no-invuln support, out-tempo. Directional — verify the teleport shenanigans."

"Aeldari — Armoured Warhost":
  verdict: "COIN-FLIP (mech gunline)"
  play: "Fire Prisms (anti-tank — chunk Knights) + War Walkers + Farseer buffs (Guide/Doom re-rolls) + Fate dice. KILL THE FIRE PRISMS + FARSEER (the buff/anti-tank engine), out-durable the rest; watch Fate dice on a key save and their evasion. Trade guns, win on durability."

"Death Guard — Flyblown Host":
  verdict: "COIN-FLIP — grindy, don't feed the FNP"
  play: "Blight-haulers + Plague Marines + Deathshroud + Bloat-Drones, 5+++/-1 Dmg. Kill the Blight-haulers/Bloat-Drones (anti-tank) at range, don't grind into the FNP, out-tempo + play the mission. Deathshroud counter-charge — screen your gun-Knights."

"Chaos Daemons — Plague Legion":
  verdict: "COIN-FLIP — grindy Nurgle"
  play: "Great Unclean One + Rotigus + Plaguebearers + Skull Cannon, FNP everywhere. Volcano the GUO/Rotigus (big, tanky, 5+++ — commit real guns), anti-infantry into the Plaguebearers, out-tempo; don't grind into the FNP horde. Win on tempo/secondaries, not attrition."
