# LIST A variant — with the Requisitioned Sisters/Immolator COVER-STRIP package.
# The ally Immolator's Purge & Cleanse (army-wide strip Benefit of Cover) = +33% to
# the Knight battery's focus-fire (BS3+ guns hit 4/6 -> 3/6 in cover). That army-wide
# strip makes the single-model Judicant's Helm redundant, so it's dropped to help pay.
# Battle Sisters (Requisitioned) bring OC2 board bodies + a meltagun+multi-melta half.
name: Knights A - Cover-Strip package (Purge the Foe)
detachments: [valourstrike-lance, dominus-foebreakers]
disposition: purge-the-foe
units:
  - {datasheet: Knight Castellan, count: 1, enhancement: Blessed Plate}
  - {datasheet: Cerastus Knight Lancer, count: 1}
  - {datasheet: Knight Crusader, count: 1, wargear: [Rapid-fire battle cannon]}  # no Judicant -- Immolator de-covers army-wide
  - {datasheet: Armiger Warglaive, count: 2}
  - {datasheet: Armiger Helverin, count: 1}
allies:
  - {datasheet: Navigator, count: 1}              # home-lock + anti-Deep-Strike
  - {datasheet: Battle Sisters Squad, count: 1}   # REQUISITIONED: OC bodies + meltagun/multi-melta half
  - {datasheet: Immolator, count: 1}              # TRANSPORT (free slot): Immolation Flamers -> Purge & Cleanse cover-strip
