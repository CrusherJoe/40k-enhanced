# COUNTER v3 to "Great Value" (Imperial Fists, Emperor's Shield 2DP + Librarius Conclave 1DP).
# STRATEGY REBUILT after killing the durability plan (2026-07-26). The hard truths:
#  - His bricks are ~unkillable AND OC22 (Lysander's Inspiring Commander, un-shockable) AND ~50-dmg melee.
#  - FNP 6+ (~1/6) does NOT save a Knight from ~50 melee, and CONTESTING his objective = getting within his
#    charge range = a dead Knight. Durability + proximity is a losing axis. Freeblade is OUT.
#  => WIN ON SPEED + RANGE + SPREAD, never entering his charge threat. His bricks are M5 and there are only
#     two -- they hold ~2 objectives; I take the OTHER 3-4 with fast Armigers + steal his home (Vital Link
#     +10). BIG-GUN STANDOFF: 3 gun-Knights sit at the BACK and delete his SOFT scorers (Sternguard, Land
#     Speeders, cyclone Termies, Vanguard, Intercessors) at 36-60"; they never approach the brick.
# DETACHMENTS (3 DP): Valourstrike Lance (2DP) + Dominus Foebreakers (1DP).
#  - Dominus Foebreakers GRANTS Priority Assets (-> I play Vital Link vs his Purge) AND gives my DOMINUS
#    Castellans +1 to hit units in a terrain area (his whole army sits on terrain objectives).
#  - Valourstrike: Rotate Ion Shields (4++ on the Oathed Knight when his alpha lands), Advance-and-still-shoot
#    (reposition the gunline without losing fire), Thunderstomp/Tactical Foil/Vow of Retribution.
name: Knights vs Great Value v3 - big-gun standoff (Priority Assets)
detachments: [valourstrike-lance, dominus-foebreakers]
disposition: priority-assets
units:
  - {datasheet: Knight Castellan, count: 1}                               # DOMINUS gun; Volcano one-shots Speeders + chunks Lysander @60"; plasma decimator shreds infantry; +1 hit vs terrain (Dominus Foebreakers). (Blessed Plate cut for points -- it sits at the back anyway.)
  - {datasheet: Knight Castellan, count: 1}                               # 2nd DOMINUS gun: 2nd Volcano/plasma/siegebreaker; +1 hit vs terrain (Dominus Foebreakers)
  - {datasheet: Knight Crusader, count: 1}                                # Avenger A18 = the anti-INFANTRY deleter (Sternguard/Vanguard/Intercessors); thermal+RFBC anti-Speeder/Termie
  - {datasheet: Armiger Helverin, count: 2}                               # backfield 36" twin-autocannons: kill Speeders/cyclone-Termies/soft support from RANGE, never in charge threat
  - {datasheet: Armiger Warglaive, count: 1}                              # M12 fast body: grab far objectives + screen the gunline; melta if a Speeder gets close
allies:
  - {datasheet: Navigator, count: 1}                                      # 12" anti-Deep-Strike dome: denies his cyclone-Termie homer drop + Land Speeder reserves near my gunline
  - {datasheet: Battle Sisters Squad, count: 1}                           # OC10 foot half cheaply LOCKS my home under the dome; melta half rides the Immolator
  - {datasheet: Immolator, count: 1}                                      # Purge & Cleanse strips cover for my WHOLE gunline (stacks with Dominus +1 hit); twin-MM; mobile OC
